# Server-side enforcement for main (CB-59).
#
# The worktree harness in tools/ is CLIENT-SIDE and PER-CLONE: hooks and
# `merge.ff` cannot be committed, so a fresh clone has zero enforcement until
# someone runs tools/install-hooks.sh, and `git push`, `git rebase`,
# `git cherry-pick`, `git revert`, `git am`, `git reset --hard` and
# `core.hooksPath` all move or publish main without passing any of it. Both
# cross-model reviewers of CB-50 independently argued that the local harness
# overclaims without this half. This is that half.
#
# WHAT THIS CATCHES, and it is exactly CB-59's stated assertion: a commit that
# is on main's FIRST-PARENT line and is NOT a merge — i.e. authored directly on
# main, or put there by rebase / cherry-pick / revert / am / reset --hard /
# amend. Those are precisely the bypasses no local hook can see, because none
# of them runs pre-commit on the resulting main.
#
# WHAT IT DOES NOT CATCH, stated plainly because the honest scope is the point:
#   - A MERGE of an untyped branch. That leaves a merge commit, which
#     --no-merges excludes by construction. Reading the branch name out of the
#     merge MESSAGE would be the name-matching heuristic CB-57 deliberately
#     refused to ship; the local pre-merge-commit hook reads the actual ref
#     instead. Client-side, therefore bypassable — a known, accepted seam.
#   - Anything at all, until origin/main is PROTECTED. A workflow cannot refuse
#     a push by itself; it reports afterwards. The refusal comes from branch
#     protection with this check marked required. Without that, this file is an
#     alarm, not a gate. See docs at the bottom of CLAUDE.md's workflow section.
#
# WHY A PINNED BASELINE. main's history predates the rule (the rule landed
# 2026-08-16, the repo did not), so asserting over all history would fail
# permanently on commits nobody is going to rewrite. The baseline is the tip at
# which enforcement begins. Moving it forward is how you would launder a
# violation, so it is a deliberate, reviewable edit to this file.

name: main invariants

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-parent-is-merges-only:
    # Push-only ON PURPOSE. The assertion is about the SHAPE OF MAIN'S HISTORY,
    # which only exists once something has landed. Running it on a pull_request
    # would walk the PR branch's own commits — every one of which legitimately
    # touches source — so it would either fail every PR or, if scoped to avoid
    # that, pass vacuously. A gate that cannot fail is worse than no gate, so it
    # runs where it can actually discriminate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert nothing but plan notes was committed directly to main
        env:
          # main as of 2026-08-17, the merge that landed CB-50's harness docs.
          BASELINE: a1fb5ab20373814c133beb1977b84a444ae1f2f7
        run: |
          set -euo pipefail

          if ! git cat-file -e "${BASELINE}^{commit}" 2>/dev/null; then
            echo "::error::baseline ${BASELINE} is not in this repository."
            echo "History was rewritten, or the baseline is wrong. Refusing to"
            echo "report main clean without a reference point to measure from."
            exit 1
          fi

          violations=0
          while read -r sha; do
            [ -z "${sha}" ] && continue
            files=$(git show --pretty=format: --name-only "${sha}" | sed '/^$/d')
            # An empty commit touches nothing and cannot violate the rule.
            [ -z "${files}" ] && continue
            offending=$(printf '%s\n' "${files}" \
              | grep -vE '^\.claude/plans/[^/]+\.md$' || true)
            if [ -n "${offending}" ]; then
              violations=$((violations + 1))
              echo "::error::direct commit on main: ${sha} $(git log -1 --format=%s "${sha}")"
              printf '%s\n' "${offending}" | sed 's/^/    /'
            fi
          done < <(git log --first-parent --no-merges --format=%H "${BASELINE}..HEAD")

          if [ "${violations}" -ne 0 ]; then
            echo ""
            echo "${violations} commit(s) reached main without going through a merge."
            echo "CLAUDE.md: every code edit happens on a short-lived branch, in a"
            echo "worktree. The only thing that may land on main directly is a"
            echo ".claude/plans/*.md note."
            exit 1
          fi
          echo "main is clean: every change since ${BASELINE:0:12} arrived by merge."

  tests:
    # CB-59's other half: the repo had no CI at all, so nothing but a local run
    # ever proved the suite green. This does not gate main's shape; it gates
    # whether the tree works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        # Pinned: CLAUDE.md records that ruff 0.16.x flags the whole repo, so an
        # unpinned CI lint would go red on a release nobody here made.
        # `ruff format` is deliberately NOT a gate — much of the existing tree is
        # non-conformant to it and gating would refuse every change.
        run: uvx ruff@0.15.7 check src/ tests/

      - name: Tests
        run: uv run --extra dev python -m pytest tests/ -q
