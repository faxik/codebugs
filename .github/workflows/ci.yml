# Lint and tests (CB-59's other half: the repo had no CI at all, so nothing but
# a local run ever proved the suite green).
#
# THIS is the job to mark as a required status check on pull requests. It runs
# on `pull_request` with no `if:` guard, so it genuinely executes and can
# genuinely fail there. Its sibling workflow, main-invariants.yml, deliberately
# does NOT subscribe to `pull_request`: a job skipped by an `if:` is reported as
# PASSING for required-check purposes, so requiring it would have produced a
# gate that can never fail on the path where it is evaluated.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is REQUIRED, not an optimisation — and unlike the
          # identical key in main-invariants.yml the requirement belongs to this
          # job's OWN SUITE, not to an audit step written beside it.
          # tests/test_worktree_harness.py::TestHarnessIntegrity::
          # test_ci_workflow_asserts_the_first_parent_invariant runs
          # `git cat-file -e <baseline>^{commit}` against the real repository,
          # and that baseline is hundreds of commits back by design. Under the
          # default depth-1 checkout the object is simply absent, so this job
          # was red in CI ALWAYS while every local run stayed green: a gate that
          # cannot pass is indistinguishable from a gate broken on the merits,
          # and the real regressions it exists to catch stop being visible.
          # Deleting this key does not make the job faster, it makes it useless;
          # the structural pin that refuses the deletion lives in that same
          # class. CB-139.
          #
          # The sibling `contracts` job below is deliberately left SHALLOW: it
          # runs tests/test_cli_signals.py and tests/test_fsio.py only, and
          # neither reads this repository's history (measured — exactly one test
          # in the whole suite does, the one named above).
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # CI is the THIRD tree this repo builds, and until CB-135 it was the one
      # nothing pinned: setup-uv named no python at all, so this job ran under
      # whatever the runner image happened to ship. `.python-version` binds it
      # to the same interpreter as main and every worktree, and this step exists
      # to make an unobtainable pin fail HERE, loudly, instead of surfacing as a
      # confusing failure inside pytest.
      - name: Interpreter (from .python-version)
        run: uv python install && uv run python -V

      - name: Lint
        # Pinned: CLAUDE.md records that ruff 0.16.x flags the whole repo, so an
        # unpinned CI lint would go red on a release nobody here made.
        # `ruff format` is deliberately NOT a gate — much of the existing tree is
        # non-conformant to it and gating would refuse every change.
        run: uvx ruff@0.15.7 check src/ tests/

      - name: Tests
        run: uv run --extra dev python -m pytest tests/ -q

  # ---------------------------------------------------------------------------
  # The pin above closes one hole and opens another, and this job is the answer
  # to it (CB-135, escalated by the CB-134 implementer).
  #
  # `requires-python = ">=3.11"` is a claim about a RANGE, and several of this
  # repo's documented contracts are stated over that whole range — the closed-
  # stdout exit code 141 above all. Nothing tests it there: every subprocess in
  # tests/test_cli_signals.py is spawned with `sys.executable`, so the suite
  # only ever measures the ONE interpreter it happens to be running under.
  # Before the pin that was survivable because different people ran different
  # versions by accident. After it, nobody ever would again, and the range
  # claim would have quietly become a claim about 3.14.4 while still being
  # written as a claim about 3.11+.
  #
  # That was a real risk, not a theoretical one: one of CB-134's mutants
  # SURVIVES on 3.14 and is killed only on 3.13.
  #
  # The alternative was to narrow the claim in CLAUDE.md to the pinned version.
  # This is cheaper than that is honest: 38 tests, ~1.7s per version, measured.
  # Deliberately NOT the whole suite — that is the pinned interpreter's job, and
  # paying ~110s four more times would buy coverage nobody asked for.
  #
  # HONEST SCOPE: this verifies 3.11-3.14. `requires-python` also admits 3.15
  # and every later release; those are unverified until added here.
  contracts:
    name: cross-version contracts (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--python` outranks `.python-version` (measured), which is what lets one
      # repo carry a pin AND a matrix without the two contradicting each other.
      - name: Contract tests
        run: >-
          uv run --python ${{ matrix.python }} --extra dev
          python -m pytest tests/test_cli_signals.py tests/test_fsio.py -q

  # ---------------------------------------------------------------------------
  # THE `tests` JOB ABOVE RUNS ONE `mcp` VERSION — THE LOCKED ONE — AND NOBODY
  # RUNS THE OTHER ONE THE RANGE ADMITS. That is CB-310, and it is not a gap in
  # coverage but a gate that cannot fire: ten tests in this suite already assert
  # that a refusal's reason reaches the MCP surface, and under `mcp` 2.1.1 all
  # ten were RED (measured: 10 failed, 3368 passed) while every local run and
  # every CI run stayed green on the locked 2.0.0. The oracle existed and was
  # loud; there was simply nothing anywhere that ran it on the version users
  # actually get.
  #
  # HOW USERS GET THE OTHER VERSION, since that is what makes this job worth its
  # four minutes rather than a hypothetical: `pipx` resolves dependencies itself
  # and does not read `uv.lock`, so an install of this package picks the newest
  # `mcp` satisfying `pyproject.toml`. That is how 2.1.1 reached the owner's
  # installed server while the lockfile still said 2.0.0.
  #
  # WHY `uv lock --upgrade-package mcp` AND NOT A PINNED VERSION STRING. The job
  # must run the NEWEST version the declared range admits, and a hardcoded
  # `mcp==2.1.1` goes stale the day the SDK releases again — at which point this
  # job would go on testing a version nobody runs, which is the very defect it
  # exists to close, rebuilt inside its own fix. `uv lock --upgrade-package mcp`
  # re-resolves that ONE dependency against `pyproject.toml`'s own
  # `mcp>=2.0.0,<3` and writes the answer into the checkout's lockfile, which is
  # thrown away with the runner. Measured locally: it moved `mcp` 2.0.0 -> 2.1.1
  # and `mcp-types` 2.0.0 -> 2.1.1, and named no version anywhere.
  #
  # WHY THE WHOLE SUITE AND NOT THE TEN TESTS. The ten are today's symptom, and
  # a job scoped to them is an enumeration: it would be blind to the eleventh
  # test that starts depending on SDK behaviour tomorrow. Unlike the `contracts`
  # matrix above — four interpreters, where the whole suite four times over
  # would buy coverage nobody asked for — this is ONE extra run of a suite that
  # takes about four minutes.
  #
  # HONEST SCOPE: this checks the newest version at the moment the job runs. It
  # says nothing about a version released between two pushes, and nothing about
  # what any particular user's installer resolved. Building the installed server
  # from the lockfile is the other half of the answer and is a separate unit.
  newest-sdk:
    name: newest mcp in the declared range
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Same requirement as the `tests` job and for the same reason: this
          # runs the whole suite, and exactly one test in it reads this
          # repository's real history. See that job's comment (CB-139).
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Interpreter (from .python-version)
        run: uv python install && uv run python -V

      - name: Resolve the newest mcp the dependency range admits
        run: |
          uv lock --upgrade-package mcp
          uv run --extra dev python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

      - name: Tests
        run: uv run --extra dev python -m pytest tests/ -q
