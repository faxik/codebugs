[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebugs"
version = "0.3.0"
description = "AI-native code finding & requirements tracker — SQLite-backed, MCP server + CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "faxik" }]
keywords = ["mcp", "code-review", "bug-tracker", "ai", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # >=2.0: server.py uses mcp.server.mcpserver.MCPServer, which replaced
    # mcp.server.fastmcp.FastMCP in the 2.0 SDK. <3 guards the next major.
    "mcp>=2.0.0,<3",
]

[project.scripts]
codebugs = "codebugs.cli:run"
codebugs-mcp = "codebugs.server:main"

[project.optional-dependencies]
# ruff IS PINNED TO AN EXACT PATCH VERSION, AND THE `dev =` LINE BELOW IS THE ONLY
# PLACE THAT DECIDES IT (CB-314) — a claim about what decides, not about what is
# written down, exactly as `.python-version` is the single source for the
# interpreter. `CONTRIBUTING.md` and the root `CLAUDE.md` still name the number
# in prose for a reader; neither drives anything, and stale prose there is a
# documentation defect rather than a tree that lints itself two different ways.
# What no EXECUTABLE line repeats is the number — not here, and no longer in
# `.github/workflows/ci.yml`, which used to be the one place it lived. The
# measurement recorded below names both versions on purpose: a measurement that
# hides what it ran on cannot be re-checked, and a dated one cannot be mistaken
# for the pin.
#
# Before the pin the version lived in one line of `.github/workflows/ci.yml`, as
# `uvx ruff@<version>`, and that command downloads its own copy without reading
# this environment at all. The guard that can actually refuse a merge
# (`tools/worktree-finish.sh`, via `uv run --extra dev ruff check`) took whatever
# version `uv.lock` happened to carry, and nothing tied the two together: one
# ordinary `uv lock --upgrade` moves the guard to the next minor release, which
# flags this tree from top to bottom, and every subsequent merge is refused on
# violations unrelated to it while CI stays green on its own downloaded copy.
# Measured 2026-09-07 on a disposable copy with the pin removed: the guard's ruff
# went 0.15.7 -> 0.16.6 and reported 568 errors on a tree 0.15.7 passes clean.
# CI now calls ruff through `uv run`, so both sides read the version from here.
#
# AND THE PIN OUTRANKS A STALE `uv.lock`, WHICH IS THE OBVIOUS DOUBT AND IS
# MEASURED RATHER THAN ASSUMED: change this line alone, leave the lockfile
# untouched, and a plain `uv run --extra dev ruff --version` answers with the NEW
# version and rewrites the lockfile on its way. **But that rewrite is a TRACKED
# change you still have to commit** — one edit, two files — and the finish script
# commits before its first `uv run`, so a bump landed without re-committing the
# lockfile leaves a stale lock in main that every ordinary `uv run` silently
# rewrites again and a `--frozen` caller consumes as-is.
#
# THE BOUNDARY, STATED RATHER THAN IMPLIED: this pin decides under uv's DEFAULT
# settings. `UV_FROZEN` / `--frozen` and `UV_NO_SYNC` run whatever the environment
# already holds; `UV_PROJECT` / `UV_WORKING_DIR` resolve against another project;
# `UV_OVERRIDE` and a `[tool.uv] override-dependencies` table replace the
# requirement outright. Nothing local can see an exported variable, so those are
# documented; the ones that live in committed files are refused by
# `tests/test_cb314_linter_pin.py`, which asserts the CI and merge-guard commands
# whole rather than by substring and fails closed on a `[tool.uv]` table appearing.
#
# EXACT PATCH, NOT `~=0.15`, for the same reason `.python-version` carries a full
# patch: a MAJOR.MINOR range leaves a divergent state representable, and making
# that state unrepresentable is the whole point. The cost is the ordinary cost of
# a pin — bumping it is a deliberate, reviewable edit.
#
# pytest is deliberately NOT pinned: no documented behaviour of this repo depends
# on its version, and a pin nobody needs is a maintenance bill nobody agreed to.
dev = ["pytest", "ruff==0.15.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/codebugs"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
