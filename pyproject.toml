[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebugs"
version = "0.2.1"
description = "AI-native code finding & requirements tracker — SQLite-backed, MCP server + CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "faxik" }]
keywords = ["mcp", "code-review", "bug-tracker", "ai", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # >=2.0: server.py uses mcp.server.mcpserver.MCPServer, which replaced
    # mcp.server.fastmcp.FastMCP in the 2.0 SDK. <3 guards the next major.
    "mcp>=2.0.0,<3",
]

[project.scripts]
codebugs = "codebugs.cli:run"
codebugs-mcp = "codebugs.server:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/codebugs"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
