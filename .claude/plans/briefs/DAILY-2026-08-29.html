const decisionsById = {};
// id -> checklist item object (decision_id or item.id), used by composePrompt() to

const checklistItemsById = {};

function renderDetailChain(details) {
  if (!details) return '';
  const parts = [];
  if (details.what) parts.push(`<p><strong>Что:</strong> ${details.what}</p>`);
  if (details.why) parts.push(`<p><strong>Почему важно:</strong> ${details.why}</p>`);
  if (details.evidence && details.evidence.length) {
    parts.push(`<p><strong>Улики:</strong></p><ul>${details.evidence.map(e => `<li><code>${e}</code></li>`).join('')}</ul>`);
  }
  if (details.on_yes) parts.push(`<p><strong>Если «да»:</strong> ${details.on_yes}</p>`);
  return parts.join('');
}

function hasAnyDetail(details) {
  return !!(details && (details.what || details.why || (details.evidence && details.evidence.length) || details.on_yes));
}

function renderMoreToggle(details) {
  if (!hasAnyDetail(details)) return '';
  return `<span class="more-toggle" onclick="toggleMore(this)">Подробнее ▾</span><div class="more">${renderDetailChain(details)}</div>`;
}

function renderCard(c) {
  const pillCls = (c.pill && c.pill.cls) || 'wait';

  return `<div class="row">
    <span class="pill ${pillCls}">${pillLabel}</span>
    <div class="row-text">
      <strong>${c.title || ''}</strong><span>${c.summary || ''}</span>
      ${renderMoreToggle(c.details)}
    </div>
  </div>`;
}

  return `<div class="dec">
    <div class="dec-head"><div class="dec-num">${num}</div>
      <div class="dec-q">${d.question || ''}${d.note ? `<small>${d.note}</small>` : ''}</div></div>
    <div class="verdict-row">${recHtml}${altHtml}</div>
    ${sourcesHtml}
    ${renderMoreToggle(d.details)}
  </div>`;
}

function renderSection(sec) {
  let inner = '';
  if (sec.cards) inner += sec.cards.map(renderCard).join('');
  if (sec.list_items) inner += `<ul>${sec.list_items.map(li => `<li>${li}</li>`).join('')}</ul>`;
  if (sec.decisions) inner += sec.decisions.map((d, i) => renderDecisionInfo(d, i + 1)).join('');
  if (sec.boxes) inner += sec.boxes.map(b => `<div class="box-${b.style}"><h4>${b.title}</h4><p>${b.text}</p></div>`).join('');
  return `<section class="section">
    <div class="section-header" onclick="toggleSection(this)">
      <div class="section-icon">${sec.icon || ''}</div>
      <h2 class="section-title">${sec.title || ''}</h2>
      <div class="section-toggle">${CHEVRON_SVG}</div>
    </div>
    <div class="section-content">${inner}</div>
  </section>`;
}

// --- checklist: decision items render as radios (recommendation + alternatives + «другое»),
// never as bracket placeholders. yesno items are the да/нет special case of the same pattern.
// text items are free-text-only (e.g. open feedback) and carry no radio.

function renderRadioOptions(name, options, defaultValue) {
  return options.map((o, i) => {
    const inputId = `opt-${name}-${i}`;
    const checked = (defaultValue !== undefined && defaultValue !== null && defaultValue === o.value) ? 'checked' : '';
    return `<label class="radio-opt" for="${inputId}">
      <input type="radio" id="${inputId}" name="dec-${name}" value="${o.value}" ${checked} onchange="onDecisionChange('${name}')">
      <span>${o.label}${o.cost ? ` <span class="opt-cost">— ${o.cost}</span>` : ''}</span>
    </label>`;
  }).join('');
}

function renderChecklistItem(item) {
  if (item.type === 'decision') {
    const d = decisionsById[item.decision_id];
    if (!d) { console.warn('daily-brief: unknown decision_id in checklist:', item.decision_id); return ''; }
    checklistItemsById[item.decision_id] = item;
    const options = [{ value: d.recommendation.label, label: d.recommendation.label }];
    (d.alternatives || []).forEach(a => options.push({ value: a.label, label: a.label, cost: a.cost }));
    options.push({ value: '__other__', label: 'другое' });
    const defaultValue = d.default === 'recommendation' ? d.recommendation.label : (d.default || null);
    return `<div class="chk-item chk-decision" data-decision-id="${item.decision_id}">
      <div class="chk-text">
        <strong>${item.title || ''}</strong><span>${item.summary || ''}</span>
        <div class="radio-group">${renderRadioOptions(item.decision_id, options, defaultValue)}</div>
        <input type="text" class="other-input" id="other-${item.decision_id}" placeholder="свой вариант…" style="display:none" oninput="onDecisionChange('${item.decision_id}')">
        <input type="text" class="clarify-input" id="clarify-${item.decision_id}" placeholder="уточнение (необязательно)" oninput="composePrompt()">
      </div>
    </div>`;
  }
  if (item.type === 'yesno') {
    checklistItemsById[item.id] = item;
    const options = [{ value: 'да', label: 'да' }, { value: 'нет', label: 'нет' }];
    return `<div class="chk-item chk-decision" data-decision-id="${item.id}">
      <div class="chk-text">
        <strong>${item.title || ''}</strong><span>${item.summary || ''}</span>
        <div class="radio-group">${renderRadioOptions(item.id, options, item.default || null)}</div>
        <input type="text" class="clarify-input" id="clarify-${item.id}" placeholder="уточнение (необязательно)" oninput="composePrompt()">
      </div>
    </div>`;
  }
  if (item.type === 'text') {
    checklistItemsById[item.id] = item;
    return `<div class="chk-item chk-text-item" data-item-id="${item.id}">
      <div class="chk-text">
        <strong>${item.title || ''}</strong><span>${item.summary || ''}</span>
        <input type="text" class="text-answer" id="text-${item.id}" placeholder="ваш ответ…" oninput="composePrompt()">
      </div>
    </div>`;
  }
  console.warn('daily-brief: unknown checklist item type:', item.type);
  return '';
}

function renderChecklist(chk) {
  if (!chk) return '';
  const groups = (chk.groups || []).map(g => `
    <div class="chk-group-title">${g.title}</div>
    ${(g.items || []).map(renderChecklistItem).join('')}
  `).join('');
  return `<div class="checklist">
    <div class="chk-title">${chk.title || ''}</div>
    <div class="chk-desc">${chk.desc || ''}</div>
    ${groups}
  </div>
  <div class="prompt-panel" id="prompt-panel" style="display:none;">
    <div class="chk-title" style="font-size:16px;">📋 Промпт для ответа</div>
    <div class="chk-desc">Готовая строка — скопируйте в чат как есть</div>
    <textarea id="prompt-out" spellcheck="false" readonly></textarea>
    <div class="prompt-actions">
      <button type="button" class="btn-copy" onclick="copyPrompt(this)">Скопировать</button>
      <button type="button" class="btn-reset" onclick="resetPrompt()">Сбросить</button>
    </div>
  </div>`;
}

function render() {
  const m = BRIEF.meta || {};
  const stats = (BRIEF.stats || []).map(s => `<div class="stat-card ${s.cls || ''}"><div class="stat-val">${s.val}</div><div class="stat-lbl">${s.lbl}</div></div>`).join('');
  const sections = (BRIEF.sections || []).map(renderSection).join('');
  const checklistHtml = renderChecklist(BRIEF.checklist);
  const tags = (m.tags || []).map(t => `<span class="tag ${t.cls || ''}">${t.text}</span>`).join('');
  const footerLinks = (m.footer_links || []).map(l => `<a href="${l.href || '#'}">${l.label}</a>`).join(' · ');

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-pre">${m.header_pre || 'Дневной бриф куратора'}</div>
      <h1 class="header-title">${m.title || ''}</h1>
      <p class="header-sub">${m.subtitle || ''}</p>
      <div class="tags">${tags}</div>
    </div>
    <div class="stats">${stats}</div>
    ${sections}
    ${checklistHtml}
    <div class="footer">Подготовлено ${m.prepared || ''}${footerLinks ? ' · ' + footerLinks : ''}</div>
  `;

  // decisions render before the checklist in DOM order, but JSON section order is
  // author-controlled — populate the map from BRIEF directly to be order-independent.
  (BRIEF.sections || []).forEach(sec => (sec.decisions || []).forEach(d => { decisionsById[d.id] = d; }));

  // Expanded sections get NO fixed max-height: a fixed scrollHeight snapshot clipped every
  // «Подробнее» opened later (owner feedback 2026-08-22). Collapse is handled by CSS.
  document.querySelectorAll('.section-content').forEach(c => { c.style.maxHeight = 'none'; });
  composePrompt();
}

function toggleSection(h) {
  const s = h.parentElement, c = s.querySelector('.section-content');
  s.classList.toggle('collapsed');
  if (!s.classList.contains('collapsed')) {
    c.style.maxHeight = c.scrollHeight + 'px';
    setTimeout(() => { c.style.maxHeight = 'none'; }, 400);  // after the transition, grow freely
  } else {
    c.style.maxHeight = c.scrollHeight + 'px';  // give the transition a start value
    requestAnimationFrame(() => { c.style.maxHeight = '0px'; });
  }
}

function toggleMore(el) {
  const m = el.nextElementSibling;
  const open = m.classList.toggle('open');
  el.textContent = open ? 'Свернуть ▴' : 'Подробнее ▾';
  const sc = el.closest('.section-content'); if (sc) sc.style.maxHeight = 'none';
}

function onDecisionChange(name) {
  const otherInput = document.getElementById('other-' + name);
  if (otherInput) {
    const selected = document.querySelector(`input[name="dec-${name}"]:checked`);
    otherInput.style.display = (selected && selected.value === '__other__') ? 'block' : 'none';
  }
  composePrompt();
}

function composePrompt() {
  const lines = [];

  document.querySelectorAll('.chk-decision').forEach(el => {
    const id = el.dataset.decisionId;
    const selected = document.querySelector(`input[name="dec-${id}"]:checked`);
    if (!selected) return;
    let valueText = selected.value;
    if (valueText === '__other__') {
      const other = document.getElementById('other-' + id);
      valueText = (other && other.value.trim()) ? other.value.trim() : '';
      if (!valueText) return; // "другое" chosen but not filled in yet — not answered
    }
    const item = checklistItemsById[id];
    if (!item) return;
    let line = `- ${item.prompt_prefix} ${valueText}.`;
    const clarify = document.getElementById('clarify-' + id);
    if (clarify && clarify.value.trim()) line += ` Уточнение: ${clarify.value.trim()}.`;
    lines.push(line);
  });

  document.querySelectorAll('.chk-text-item').forEach(el => {
    const id = el.dataset.itemId;
    const input = document.getElementById('text-' + id);
    if (input && input.value.trim()) {
      const item = checklistItemsById[id];
      if (item) lines.push(`- ${item.prompt_prefix} ${input.value.trim()}`);
    }
  });

  const panel = document.getElementById('prompt-panel');
  const ta = document.getElementById('prompt-out');
  if (!panel || !ta) return;
  if (lines.length === 0) {
    panel.style.display = 'none';
    ta.value = '';
    return;
  }
  const date = (BRIEF.meta && BRIEF.meta.date_iso) || '';
  ta.value = [`Решения владельца по дневному брифу ${date}:`, ...lines].join('\n');
  panel.style.display = 'block';
}

function copyPrompt(btn) {
  const ta = document.getElementById('prompt-out');
  const text = ta.value;
  const orig = btn.textContent;
  function done() {
    btn.textContent = 'Скопировано ✓';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => {
      ta.select();
      document.execCommand('copy');
      done();
    });
  } else {
    ta.select();
    document.execCommand('copy');
    done();
  }
}

function resetPrompt() {
  document.querySelectorAll('.chk-decision input[type=radio]:checked').forEach(r => { r.checked = false; });
  document.querySelectorAll('.other-input, .clarify-input, .text-answer').forEach(i => { i.value = ''; i.style.display = (i.classList.contains('other-input')) ? 'none' : i.style.display; });
  composePrompt();
}

render();
</script>
</body>
</html>
